<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const base = '/react_phone-catalog/';
      const route = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length)
        : '';

      window.location.replace(
        `${base}?route=${encodeURIComponent(`/${route}${window.location.search}${window.location.hash}`)}`,
      );
    </script>
    <title>Redirecting</title>
  </head>
  <body></body>
</html>
